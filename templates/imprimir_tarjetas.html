<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Tarjetas - {{ cliente.nombre }}</title>
    <style>
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .page-break {
                page-break-after: always;
            }
        }

        body {
            font-family: Arial, sans-serif;
        }

        .tarjeta {
            width: 48%;
            border: 1px solid #000;
            padding: 10px;
            box-sizing: border-box;
            margin: 1%;
            float: left;
            height: 300px;
            display: flex;
            justify-content: space-between;
            background-image: url("{{ url_for('static', filename='imagenes/fondo_tarjeta.jpg') }}");
            background-size: 100% 100%; /* <-- Aquí el cambio clave */
            background-position: center;
            background-repeat: no-repeat; /* <-- Evita que se repita */
            position: relative;
            color: black;
        }

        .texto {
            width: 65%;
            font-size: 14px;
            padding-right: 10px;
        }

        .codigo {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 5px;
            text-align: left;
        }
		
        .qr-img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            display: block;
            margin-bottom: 2px;
        }
		
        .codigo p {
            margin: 0;
            font-size: 20px;
        }

        .container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<h2>Tarjetas de {{ cliente.nombre }}</h2>

<div class="container">
    {% for qr in cliente.codigos %}
        <div class="tarjeta">
            <div class="texto">
            </div>
            <div class="codigo">
                <img src="{{ url_for('static', filename='qr_codes/' + ("%04d"|format(qr.numero_correlativo)) + '.png') }}" class="qr-img">
                <p><strong>N° {{ "%04d"|format(qr.numero_correlativo) }}</strong></p>
            </div>
        </div>
        {% if loop.index % 6 == 0 %}
            <div class="page-break"></div>
        {% endif %}
    {% endfor %}
</div>

<script>
    window.onload = () => window.print();
</script>

</body>
</html>
