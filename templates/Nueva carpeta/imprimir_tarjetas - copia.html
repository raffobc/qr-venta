<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Tarjetas - {{ cliente.nombre }}</title>
    <style>
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .page-break {
                page-break-after: always;
            }
        }

        body {
            font-family: Arial, sans-serif;
        }

        .tarjeta {
            width: 48%;
            border: 1px solid #000;
            padding: 10px;
            box-sizing: border-box;
            margin: 1%;
            float: left;
            height: 300px;
            text-align: center;
        }

        .qr-img {
            max-width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<h2>Tarjetas de {{ cliente.nombre }}</h2>

<div class="container">
    {% for qr in cliente.codigos %}
        <div class="tarjeta">
            <img src="{{ url_for('static', filename='qr_codes/' + ("%04d"|format(qr.numero_correlativo)) + '.png') }}" class="qr-img">
            <p><strong>N° {{ "%04d"|format(qr.numero_correlativo) }}</strong></p>
           
        </div>
        {% if loop.index % 6 == 0 %}
            <div class="page-break"></div>
        {% endif %}
    {% endfor %}
</div>

<script>
    window.onload = () => window.print();
</script>

</body>
</html>
