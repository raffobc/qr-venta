<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión Gastronómica 1.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        header {
            background-color: #dc3545;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }
        footer {
            margin-top: 4rem;
            padding: 1rem;
            border-top: 1px solid #ccc;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container">
    <header class="text-center">
        <h1 class="mb-0">Sistema de Gestión Gastronómica 1.0</h1>
    </header>

    <h2 class="mb-4 text-center">QR de {{ cliente.nombre }}</h2>

    <div class="row">
        {% for codigo in cliente.codigos|sort(attribute='numero_correlativo') %}
        <div class="col-md-3 text-center mb-4">
            <p><strong>N° {{ "%04d"|format(codigo.numero_correlativo) }}</strong></p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?data={{ codigo.codigo }}&size=200x200" alt="QR" class="img-fluid border">
            <p class="mt-2">{{ codigo.estado|capitalize }}</p>
        </div>
        {% endfor %}
    </div>

    <div class="text-center">
        <a href="{{ url_for('index') }}" class="btn btn-outline-dark mt-3">⬅ Volver</a>
    </div>
</div>

<footer>
    Diseñado por <a href="https://www.instagram.com/raffo.bustamante" target="_blank">@raffo.bustamante</a>
</footer>

</body>
</html>
