<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>QR de {{ cliente.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">QR de {{ cliente.nombre }}</h1>

    <div class="row">
        {% for codigo in cliente.codigos %}
        <div class="col-md-3 text-center mb-4">
            <p><strong>N° {{ "%04d"|format(codigo.numero_correlativo) }}</strong></p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?data={{ codigo.codigo }}&size=200x200" alt="QR" class="img-fluid">
            <p class="mt-2">{{ codigo.estado|capitalize }}</p>
        </div>
        {% endfor %}
    </div>

    <a href="{{ url_for('index') }}" class="btn btn-outline-dark mt-3">⬅ Volver</a>
</div>
</body>
</html>
