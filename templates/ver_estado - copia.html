<h1>Estado del Código QR</h1>
<p><strong>Código:</strong> {{ qr.codigo }}</p>
<p><strong>Estado actual:</strong> {{ qr.estado }}</p>
{% if qr.monto_pagado %}<p><strong>Monto pagado:</strong> S/ {{ qr.monto_pagado }}</p>{% endif %}
<form method="POST">
    <label>Estado:</label>
    <select name="estado" id="estado" onchange="mostrarCampoMonto()">
        <option value="sin pagar" {% if qr.estado == 'sin pagar' %}selected{% endif %}>Sin pagar</option>
        <option value="pagado" {% if qr.estado == 'pagado' %}selected{% endif %}>Pagado</option>
    </select>
    <div id="campoMonto" style="display:none;">
        <label>Monto Pagado:</label>
        <input type="number" name="monto" step="0.01" value="{{ qr.monto_pagado or '' }}">
    </div>
    <button type="submit">Guardar</button>
</form>
<script>
function mostrarCampoMonto() {
    var estado = document.getElementById('estado').value;
    document.getElementById('campoMonto').style.display = (estado === 'pagado') ? 'block' : 'none';
}
window.onload = mostrarCampoMonto;
</script>
<a href="{{ url_for('index') }}">Volver</a>
